
services:
  - type: web
    name: georisk-ai-api
    runtime: python
    plan: free
    rootDir: georisk-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
